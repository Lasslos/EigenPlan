  "/WebUntis/api/rest/view/v1/messages/{messageId}/attachmentstorageurl":
    get:
      tags: [messages]
      summary: Get a short-lived, SSE-C-encrypted download URL for an S3-backed message attachment
      description: |
        `storageAttachments[].id` from a message detail is passed here as `messageId` (despite the parameter
        name, this is really the *attachment* id, not the message id — **UNKNOWN**, needs re-verification
        against a message with more than one storage attachment to see whether it's actually keyed by message
        or by attachment). The returned `downloadUrl` is an S3 pre-signed URL that additionally requires the
        three `additionalHeaders` to be replayed verbatim on the follow-up `GET` to that URL (server-side
        encryption with a customer-supplied key, SSE-C) — a plain `GET downloadUrl` without those headers will
        fail. `downloadUrl` expires quickly (observed `X-Amz-Expires=600`, i.e. 10 minutes).
      parameters:
        - $ref: '#/components/parameters/school'
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentStorageUrl'
              example:
                additionalHeaders:
                  - { key: "x-amz-server-side-encryption-customer-key", value: "<redacted-base64-aes-key>" }
                  - { key: "x-amz-server-side-encryption-customer-key-md5", value: "<redacted-base64-md5>" }
                  - { key: "host", value: "storage.webuntis.com" }
                  - { key: "x-amz-server-side-encryption-customer-algorithm", value: "AES256" }
                downloadUrl: "https://storage.webuntis.com/untis-sts-prod/<tenantId>/<objectId>?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=600&X-Amz-Signature=<redacted>"

  # ---------------------------------------------------------------------------------------------------------
  # Calendar
  # ---------------------------------------------------------------------------------------------------------
  /WebUntis/api/rest/view/v2/calendar-entry/detail:
    get:
      tags: [calendar]
      summary: Get the full detail of one or more calendar entries (a period, exam, event, ...) by element + time range
      description: |
        Used for the "tap a period to see detail" drill-down, and (with `elementType=5`/STUDENT confirmed) to
        resolve homework/notes/attachments for a specific slot. `elementType`+`elementId` identify a
        *resource* the same way `timetable/entries`'s `resourceType`+`resources` do — `elementId` is
        `session.userData.id` (the logged-in resource's own id), **not** a period/grid-entry id — confirmed
        via a 2026-08 live probe: querying with a `GridEntry.ids[]` value as `elementId` reliably returned
        zero `calendarEntries`, while querying with `userData.id` for the same time window returned the
        expected period(s). `startDateTime`/`endDateTime` narrow to exactly the slot(s) you already know
        about from the grid/entries response; the response's `calendarEntries[].id` is what identifies each
        returned period, not something you supply as input.
      parameters:
        - $ref: '#/components/parameters/school'
        - name: elementType
          in: query
          required: true
          description: |
            Integer enum, resource-type-dependent (matches `session.userData.type`). Confirmed via 2026-08
            live probe: `5` = STUDENT, `2` = TEACHER. `CLASS`/`ROOM`/`SUBJECT` values still **UNKNOWN** (no
            CLASS-mode test account had timetable data in range to probe). `7`/`8` were tried and returned
            HTTP 500 `INTERNAL_ERROR` — not valid values, not just "no data".
          schema: { type: integer }
          example: 5
        - name: elementId
          in: query
          required: true
          description: "The resource's own id for the given `elementType` — e.g. `session.userData.id` when `elementType` matches `session.userData.type`. Not a period/grid-entry id."
          schema: { type: integer }
        - name: startDateTime
          in: query
          required: true
          schema: { type: string, format: date-time }
          example: "2026-08-19T09:50:00"
        - name: endDateTime
          in: query
          required: true
          schema: { type: string, format: date-time }
          example: "2026-08-19T11:20:00"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [calendarEntries]
                properties:
                  calendarEntries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarEntry'

  # ---------------------------------------------------------------------------------------------------------
  # Timetable (new REST implementation)
  # ---------------------------------------------------------------------------------------------------------
  /WebUntis/api/rest/view/v1/timetable/menu:
    get:
      tags: [timetable]
      summary: Timetable "menu" (available resources/views for the current user)
      description: |
        Top-level success shape confirmed (2026-08 live probe): 200 with `{myTimetable, dependents,
        availableTimetables}` was the **normal** response for every non-anonymous credentialed account
        tested (`cjd-koewi` CLASS, `schuldorf` STUDENT, `wolfsburger-oberschule` TEACHER) — this is not a
        rare case, it's what any account with real timetable access gets back. Only the anonymous `bs-gfv`
        account (no timetable resource at all) hit the `NO_TIMETABLES_AVAILABLE_FOR_YOUR_USER` 404 path.
        Nested shape confirmed (2026-08 live probe against `wolfsburger-oberschule`, see
        `../captures/home/timetable_menu.md`) — see `TimetableMenuResponse` below. This is the first call
        the app's "switch timetable" picker makes.
      security:
        - bearerAuth: []
        - anonymousSchoolHeader: []
      parameters:
        - $ref: '#/components/parameters/school'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableMenuResponse'
        '404':
          description: No timetable available for this user (observed as HTTP 404, not 200-with-error-field, unlike most other REST endpoints)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: NO_TIMETABLES_AVAILABLE_FOR_YOUR_USER
                requestId: "ae5538a079b6225703a3d044bb1a3693"
                traceId: ""
                validationErrors:
                  - { path: "", errorMessage: "No timetables available for the current user!" }

  /WebUntis/api/rest/view/v1/timetable/entries/settings:
    get:
      tags: [timetable]
      summary: Per-resource-type display settings for the timetable UI (which overlays/highlights to show)
      parameters:
        - $ref: '#/components/parameters/school'
        - name: resourceType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ResourceType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableEntriesSettings'

  /WebUntis/api/rest/view/v1/timetable/entries:
    get:
      tags: [timetable]
      summary: Get timetable entries for one or more resources over a date range
      description: |
        The main timetable data endpoint — supersedes `getTimetable2017`'s `periods` array with a richer,
        pre-laid-out model (`gridEntries[].position1`..`position7`, `layoutGroup`/`layoutStartPosition`/`layoutWidth`
        for overlapping-period rendering, `icons` for homework/notes badges). `resources` is a comma-separated
        list of IDs of `resourceType`; `periodTypes` is a comma-separated list of `PeriodType` values you want
        included (the app requests all known types up front). `format` selects a display-format id (see
        `timetable/grid`'s `formatDefinitions[].id` — `8` and `1` were both observed as request values, `1` is
        echoed back in every captured response regardless of what was requested — **UNKNOWN** what `format=8`
        in the request actually changes, or whether the response `format` field is meant to differ from the
        request one at all).
      parameters:
        - $ref: '#/components/parameters/school'
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
        - name: format
          in: query
          required: true
          description: "Display-format id. **UNKNOWN** exact effect — see description above."
          schema: { type: integer }
        - name: resourceType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: resources
          in: query
          required: true
          description: Comma-separated resource IDs.
          schema: { type: string }
          example: "1664"
        - name: periodTypes
          in: query
          required: true
          description: Comma-separated `PeriodType` values.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PeriodType'
        - name: layout
          in: query
          required: true
          schema:
            type: string
            enum: [PRIORITY]
            description: "Only `PRIORITY` observed; other values **UNKNOWN**."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableEntriesResponse'
        '404':
          description: "Observed for a resource ID with no timetable / not found for this resourceType."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: NOT_FOUND
                requestId: "840918165983030123c850663c9d3c60"
                traceId: ""
                validationErrors:
                  - { path: "", errorMessage: "One or more requested entities could not be found." }

  /WebUntis/api/rest/view/v1/timetable/grid:
    get:
      tags: [timetable]
      summary: Get the timetable grid layout (time slots, days, and all available display-format definitions)
      description: |
        Static-ish layout metadata (period start/end times per weekday, the multiple named "format" presets a
        school can offer, e.g. a lesson-numbered grid vs. a wall-clock-hours grid) — fetched once and cached
        client-side, then used together with `timetable/entries` to lay out the actual grid. Independent of
        any specific resource.
      parameters:
        - $ref: '#/components/parameters/school'
        - name: extendForEdgeBreakSupervisions
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableGrid'

  /WebUntis/api/rest/view/v1/timetable/filter:
    get:
      tags: [timetable]
      summary: Searchable directory of resources for a given resourceType — feeds the "switch timetable" picker's search UI
      description: |
        Not previously documented; live-probed 2026-08 against `wolfsburger-oberschule` (TEACHER account),
        see `../captures/home/timetable_filter.md` for the full capture. Typically called after
        `timetable/menu`, once per `resourceType` the user switches to/searches within (`menu`'s
        `availableTimetables` lists which types are allowed). One unified response shape is returned
        regardless of `resourceType` requested — only the array matching the requested type is populated.

        `anonymousSchoolHeader` support confirmed live (2026-08 probe against `bs-gfv`) but **partial, not
        blanket**: `resourceType=CLASS` gets a normal 200, `STUDENT`/`TEACHER`/`ROOM` get `403 Forbidden` on
        the same anonymous session. See `../spec/NOTES.md` §2b/§4b.
      security:
        - bearerAuth: []
        - anonymousSchoolHeader: []
      parameters:
        - $ref: '#/components/parameters/school'
        - name: resourceType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: includePublicTimetables
          in: query
          required: false
          description: "Sent as `true` on every observed request; effect **UNKNOWN** — not isolated against a request without it. May be what exposes resources beyond what the account could otherwise see (relevant to anonymous access, see NOTES.md §2b/§3)."
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableFilterResponse'

  /WebUntis/api/rest/view/v1/schoolyears:
    get:
      tags: [timetable]
      summary: List of the school's school years
      description: |
        Not previously documented; live-probed 2026-08 against `wolfsburger-oberschule` (TEACHER account),
        see `../captures/home/schoolyears.md`. Distinct from the legacy `getUserData2017`'s
        `masterData.schoolyears` (see `test/live/known_gaps.dart`) — field names match but the two haven't
        been cross-checked for identical `id` numbering. Relationship to the timetable resource-picker flow
        is **UNKNOWN** — nothing in `timetable/entries`'s confirmed params references a school-year id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/school'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolYear'

components:
  parameters:
    school:
      name: school
      in: query
      required: true
      description: The school's `loginName`, e.g. `cjd-koewi`. Redundant with the server hostname but sent on every call.
      schema:
        type: string
      example: cjd-koewi

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtained either from the JSON-RPC `getAuthToken` method or from `POST .../authentication`. Sent as
        `Authorization: Bearer <jwt>` on every `/WebUntis/api/**` REST call. See `JwtClaims` for the decoded
        payload shape (informational only — not returned as JSON anywhere, must be base64url-decoded from the
        token by the client if any claim is needed locally).
    anonymousSchoolHeader:
      type: apiKey
      in: header
      name: anonymous-school-base64
      description: |
        Alternative to `bearerAuth` for schools with `anonymousLoginEnabled: true`. Value is the school's
        `loginName`, base64-encoded (e.g. `bs-gfv` → `YnMtZ2Z2`). Only confirmed to work on the 3 endpoints
        that declare it as an alternative security scheme in this document — see the top-level description's
        "Anonymous login" section for what's unconfirmed.

  schemas:
    # ---- shared / auth ----------------------------------------------------------------------------------
    AuthObject:
      type: object
      required: [clientTime, otp, user]
      description: |
        Carried inside the single params object of most legacy JSON-RPC methods. `otp` is a 6-digit TOTP
        computed from the app-shared-secret (RFC 6238, same algorithm as the `otp` package already used in
        `lib/core/untis/untis_session.dart`); for anonymous logins it's the literal integer `0`. `clientTime`
        is epoch milliseconds, used as the TOTP time step input — matching this closely to real time matters,
        drift causes `-6002`-style auth errors (see `RpcError`).
      properties:
        clientTime:
          type: integer
          format: int64
          description: Client epoch time in **milliseconds**.
        otp:
          type: integer
          description: 6-digit TOTP, or literal `0` for anonymous logins.
        user:
          type: string
          description: Username, or the literal string `#anonymous#` for anonymous logins.

    RpcErrorEnvelope:
      type: object
      required: [id, jsonrpc, error]
      properties:
        id: { type: string }
        jsonrpc: { type: string, enum: ["2.0"] }
        error:
          $ref: '#/components/schemas/RpcError'
    RpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: "Negative error codes observed, e.g. `-6003` = \"too many results\" on `searchSchool\". Full enum **UNKNOWN**."
        message:
          type: string

    ErrorResponse:
      type: object
      description: Common REST (non-JSON-RPC) error envelope, returned with a non-2xx HTTP status.
      required: [errorCode, requestId, traceId, validationErrors]
      properties:
        errorCode:
          type: string
          description: "String enum. Observed values: `NOT_FOUND`, `NO_TIMETABLES_AVAILABLE_FOR_YOUR_USER`. Full enum **UNKNOWN**."
        requestId: { type: string }
        traceId: { type: string }
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required: [path, errorMessage]
      properties:
        path: { type: string }
        errorMessage: { type: string }

    JwtClaims:
      type: object
      description: |
        Informational: the decoded payload of the bearer JWT (standard JWT, header/payload/signature; not
        itself an API response body). Both `getAuthToken` and `POST .../authentication` were observed to issue
        structurally identical claims, except `authentication`'s token had an **empty** `host` claim where
        `getAuthToken`'s carried the real school server hostname — unconfirmed whether that's meaningful.
      properties:
        tenant_id: { type: string }
        sub: { type: string, description: "Username, same as `username`." }
        roles: { type: string, description: "Always empty string in captures." }
        iss: { type: string, enum: [webuntis] }
        locale: { type: string, example: de }
        sc: { type: string, example: de }
        user_type: { type: string, enum: [USER] }
        route: { type: string, description: Internal routing hostname for the backend cluster. }
        user_id: { type: integer }
        host: { type: string, description: "School server hostname, or empty string — see description above." }
        sn: { type: string, description: School `loginName`. }
        scopes: { type: string, example: "mg:r" }
        exp: { type: integer, format: int64, description: Unix seconds. Observed ~15 minute lifetime. }
        per:
          type: array
          items: { type: string }
        iat: { type: integer, format: int64 }
        username: { type: string }
        sr: { type: string, description: "State/region code, e.g. `DE-NW`." }
        person_id: { type: integer }

    # ---- discovery ----------------------------------------------------------------------------------------
    SearchSchoolRequest:
      type: object
      required: [id, jsonrpc, method, params]
      properties:
        id: { type: string }
        jsonrpc: { type: string, enum: ["2.0"] }
        method: { type: string, enum: [searchSchool] }
        params:
          type: array
          minItems: 1
          maxItems: 1
          items:
            oneOf:
              - type: object
                required: [search]
                properties: { search: { type: string } }
              - type: object
                required: [tenantid]
                properties: { tenantid: { type: string } }
    SearchSchoolResult:
      type: object
      required: [id, jsonrpc, result]
      properties:
        id: { type: string }
