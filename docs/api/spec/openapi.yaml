              message that had actually been replied to) — not "always empty" as previously documented from
              accounts with no reply threads. Each item looks like a nested `MessageDetail`-shaped reply,
              plus `recipients`/`isRevoked` which the top-level `MessageDetail` doesn't have. Nested field
              *types* are inferred from the sibling top-level schemas, not independently re-verified.
