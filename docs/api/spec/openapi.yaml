    # ---- timetable (new REST) ---------------------------------------------------------------------------------
    ResourceType:
      type: string
      description: |
        `CLASS`/`STUDENT`/`TEACHER`/`ROOM` all confirmed live (2026-08 probe, `wolfsburger-oberschule`) as
        valid `timetable/filter` and `timetable/menu.availableTimetables` values — see
        `../captures/home/timetable_filter.md`. `ROOM`'s validity specifically against `timetable/entries`
        itself hasn't been separately re-confirmed this round (only `CLASS`/`TEACHER` were). `SUBJECT` is
        presumed but still **UNKNOWN** — never observed as a valid resourceType anywhere, only as a value
        of `GridEntry`'s inner `type` field.
      enum: [CLASS, STUDENT, TEACHER, ROOM]

    TimetableResource:
      type: object
      description: Common `{id, shortName, longName, displayName}` shape used for classes/teachers/rooms/students/subjects throughout the timetable REST API (`timetable/entries`, `timetable/menu`, `timetable/filter`).
      properties:
        id: { type: integer }
        shortName: { type: string }
        longName: { type: string }
        displayName: { type: string, description: "Often an empty string in `timetable/entries`'s `TimetableDay.resource` — **UNKNOWN** when populated there. In `timetable/menu`/`timetable/filter` responses, semantics differ by resource type rather than being uniformly `== shortName`: confirmed live (2026-08, wolfsburger-oberschule) equal to `shortName` for a `TEACHER` entry (an abbreviation, e.g. `\"ML\"`), but for a `STUDENT` entry the *fullest* available name (`\"Merab Davituliani\"`) — fuller than `longName`, which was surname-only (`\"Davituliani\"`) for that same student. Prefer `displayName` over `longName` for `STUDENT`; not re-verified for `CLASS`/`ROOM`." }
    PeriodType:
      type: string
      description: "Full list as requested by the app's `timetable/entries` call (not all individually confirmed to ever be *returned* — only `NORMAL_TEACHING_PERIOD` and `EVENT` were observed in response data)."
      enum:
        - NORMAL_TEACHING_PERIOD
        - ADDITIONAL_PERIOD
        - STAND_BY_PERIOD
        - OFFICE_HOUR
        - EXAM
        - BREAK_SUPERVISION
        - EVENT
        - MEETING
        - PLATFORM_CALENDAR_EVENT
        - PERSONAL_CALENDAR_EVENT

    TimetableEntriesSettings:
      type: object
      description: All fields boolean; every field toggles a display overlay in the timetable UI.
      properties:
        showSymbols: { type: boolean }
        showTeacherAbsences: { type: boolean }
        showStudentAbsences: { type: boolean }
        showRoomLocks: { type: boolean }
        showResourceLocks: { type: boolean }
        showForeignSubstitutions: { type: boolean }
        showICal: { type: boolean }
        showICalExport: { type: boolean }
        showAllDropdownElements: { type: boolean }
        highlightChanges: { type: boolean }
        highlightExams: { type: boolean }
        highlightCancellations: { type: boolean }
        highlightExternalEntries: { type: boolean }

    TimetableEntriesResponse:
      type: object
      required: [format, days, errors]
      properties:
        format: { type: integer, description: "Echoes a display-format id — see the operation description for the open question about whether the request's `format` value actually changes this." }
        days:
          type: array
          items: { $ref: '#/components/schemas/TimetableDay' }
        errors:
          type: array
          items: {}
          description: "**UNKNOWN** item shape — always empty in captures; likely `ValidationError`-shaped, for partial failures within an otherwise-200 multi-resource request."
    TimetableDay:
      type: object
      properties:
        date: { type: string, format: date }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resource: { $ref: '#/components/schemas/TimetableResource' }
        status:
          type: string
          description: "Observed: `REGULAR`, `NOT_ALLOWED` (e.g. querying dates outside the school's active school-year range)."
        dayEntries: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures; distinct from `gridEntries`, name suggests all-day entries." }
        gridEntries:
          type: array
          items: { $ref: '#/components/schemas/GridEntry' }
        backEntries: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures." }
    GridEntry:
      type: object
      description: |
        One rendered timetable cell. `ids` groups together the underlying period-instance id(s) this cell
        represents (>1 when consecutive identical periods are merged into one visual block, e.g. a double
        lesson) — these are the ids to pass into `getPeriodData2017`'s `ttIds`. **Not** valid for
        `calendar-entry/detail`'s `elementId` (confirmed via 2026-08 live probe) — that endpoint's
        `elementId`/`elementType` identify a *resource* (e.g. `session.userData.id` + the resource's
        `elementType`, same shape as `timetable/entries`'s `resources` param), not a period; you get period
        ids back in the response, you don't look one up by its id. `position1`..`position7` are independently-nullable *slots* the UI renders in order, and
        the mapping is resource-type-dependent — confirmed via a live capture against a real `TEACHER`
        resource: `position1=CLASS`, `position2=SUBJECT` (or `INFO` for non-teaching entries like `EVENT`),
        `position3=ROOM` — the inverse of the `STUDENT`/`CLASS` resource ordering (`position1=TEACHER`,
        `position2=SUBJECT`, `position3=ROOM`) documented elsewhere in this file. `position4`-`position7`
        still unobserved for any resource type — **UNKNOWN**.

        `layoutStartPosition`/`layoutWidth` are genuinely meaningful (not always `0`/`1000` as the original
        captures suggested) — confirmed via a live capture with real overlapping periods: the server computes
        a proportional layout per `layoutGroup` (all entries sharing a `layoutGroup` value co-occur in time),
        e.g. one long-spanning entry pinned to a fixed-width column for its whole duration while shorter
        entries dynamically share the remaining width — full width when only one thing is happening at that
        moment, split evenly when two genuinely coincide. See `../captures/home/timetable_entries_overlap_example.md`
        for the raw values. The app itself no longer models these three fields on `GridEntry`, though —
        they assume every period the server knows about is being rendered, which breaks once the client can
        hide individual courses (see NOTES.md §4); layout is computed client-side instead, over whatever's
        actually visible.
      properties:
        ids: { type: array, items: { type: integer } }
        duration:
          type: object
          properties:
            start: { type: string, format: date-time, description: "No seconds, e.g. `2026-08-17T08:00`." }
            end: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/PeriodType' }
        status: { type: string, description: "Observed: `REGULAR`, `CHANGED`, `CANCELLED`." }
        statusDetail: { type: string, nullable: true, description: "Observed: `SUBSTITUTED` (paired with `status: CHANGED`), or `null`." }
        name: { type: string, nullable: true }
        layoutStartPosition: { type: integer, description: "0-1000 horizontal offset within the day column, paired with `layoutWidth`. Confirmed non-trivial values (not always `0`) when genuinely overlapping — see `../captures/home/timetable_entries_overlap_example.md`." }
        layoutWidth: { type: integer, description: "Out of 1000. `1000` when nothing overlaps; shared proportionally among everything active in the same `layoutGroup` at a given moment otherwise (e.g. two simultaneous periods each get `500`, or `333` when a third, day-long entry also occupies a fixed column for the same `layoutGroup`) — see `../captures/home/timetable_entries_overlap_example.md`." }
        layoutGroup: { type: integer, description: "Groups entries that co-occur in time within the day; entries sharing a `layoutGroup` value share `layoutStartPosition`/`layoutWidth` accounting. Sequential per day (1-based), not a stable id." }
        color: { type: string, nullable: true, description: "6-digit hex, no `#`. Tracks period status/type more than subject identity — the same subject was observed in different colors depending on status in one capture. Treat as a suggested default only, not authoritative — see NOTES.md's color rule." }
        notesAll: { type: string }
        icons:
          type: array
          items: { type: string }
          description: "Observed: `HOMEWORK`, `NOTES`. Enum likely not exhaustive."
        position1: { nullable: true, type: array, items: { $ref: '#/components/schemas/GridEntryPositionItem' } }
        position2: { nullable: true, type: array, items: { $ref: '#/components/schemas/GridEntryPositionItem' } }
        position3: { nullable: true, type: array, items: { $ref: '#/components/schemas/GridEntryPositionItem' } }
        position4: { nullable: true, type: array, items: { $ref: '#/components/schemas/GridEntryPositionItem' } }
        position5: { nullable: true, type: array, items: { $ref: '#/components/schemas/GridEntryPositionItem' } }
        position6: { nullable: true, type: array, items: { $ref: '#/components/schemas/GridEntryPositionItem' } }
        position7: { nullable: true, type: array, items: { $ref: '#/components/schemas/GridEntryPositionItem' } }
        texts:
          type: array
          items:
            type: object
            properties:
              type: { type: string, description: "Observed: `SUBSTITUTION_TEXT`, `LESSON_INFO`." }
              text: { type: string }
        lessonText: { type: string }
        lessonInfo: { type: string, nullable: true }
        substitutionText: { type: string }
        userName: { type: string, nullable: true, description: "**UNKNOWN** — always `null` in captures." }
        moved: { nullable: true, description: "**UNKNOWN** shape." }
        durationTotal: { nullable: true, description: "**UNKNOWN** shape." }
        link: { nullable: true, description: "**UNKNOWN** shape." }
    GridEntryPositionItem:
      type: object
      properties:
        current:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/GridEntryPositionElement' }]
          description: "Confirmed `null` live for a substitution that removes a position with nothing filling it back in — e.g. a lesson's teacher called in sick with no covering teacher assigned, so `position1` (TEACHER) has `current: null` and `removed` set to the original teacher, status `REMOVED`."
        removed:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/GridEntryPositionElement' }]
          description: "Confirmed populated for a real substitution — `current` (status `ADDED`) is the new room/teacher, `removed` (status `REMOVED`) is the original, e.g. a room change or a covering teacher. See `../captures/home/timetable_entries_overlap_example.md`."
    GridEntryPositionElement:
      type: object
      properties:
        type: { type: string, description: "Observed: `TEACHER`, `SUBJECT`, `ROOM`, `CLASS`, `INFO`. `CLASS` and `INFO` confirmed via a `resourceType: TEACHER` capture — see `GridEntry`'s description for the resource-type-dependent position ordering." }
        status: { type: string, description: "Observed: `REGULAR`, `ADDED`, `REMOVED` (the latter two on a substituted `current`/`removed` pair)." }
        shortName: { type: string }
        longName: { type: string }
        displayName: { type: string }
        displayNameLabel: { type: string, nullable: true, description: "Observed `NAME`, or `null` for `type: INFO`. Other values **UNKNOWN**." }

    TimetableGrid:
      type: object
      properties:
        firstDayOfWeek: { type: string, enum: [MO], description: "Only `MO` observed. Presumably follows locale for schools with a Sunday-first week — **UNKNOWN**." }
        studentFormat: { type: integer, description: "Default `formatDefinitions[].id` to use for `resourceType: STUDENT`." }
        classFormat: { type: integer }
        subjectFormat: { type: integer }
        teacherFormat: { type: integer }
        roomFormat: { type: integer }
        resourceFormat: { type: integer, description: "Observed `-1`, matching `formatDefinitions[].id: -1` (`RESOURCE_TIMETABLE_DEFAULT`)." }
        formatDefinitions:
          type: array
          items: { $ref: '#/components/schemas/FormatDefinition' }
    FormatDefinition:
      type: object
      properties:
        id: { type: integer, description: "`-1` is the synthetic `RESOURCE_TIMETABLE_DEFAULT` entry; `0`/`1`/etc. are school-configured named formats." }
        name: { type: string }
        longname: { type: string }
        showStartEndTimeOfSlots: { type: boolean }
        showStartEndTime: { type: boolean }
        showCancellations: { type: boolean }
        showExternalCalendars: { type: boolean }
        hideDetails: { type: boolean }
        minRows: { type: integer }
        duration:
          type: object
          description: "Note: **no `T` prefix** here, unlike `LegacyTimeGrid`'s `T07:55`-style times — just `\"07:30\"`."
          properties:
            start: { type: string, pattern: '^\d{2}:\d{2}$' }
            end: { type: string, pattern: '^\d{2}:\d{2}$' }
        timeGridType: { type: string, enum: [LESSON_GRID, CLOCK_HOURS] }
        timeGridDays:
          type: array
          items: { type: string, enum: [MO, TU, WE, TH, FR, SA, SU] }
        timeGridSlots:
          type: array
          items:
            type: object
            properties:
              name: { type: string, nullable: true }
              number: { type: integer, nullable: true, description: "`null` observed on the non-lesson-numbered (`CLOCK_HOURS`) and one `LESSON_GRID` format — not reliably present." }
              duration:
                type: object
                properties:
                  start: { type: string, pattern: '^\d{2}:\d{2}$' }
                  end: { type: string, pattern: '^\d{2}:\d{2}$' }

    # ---- timetable/menu, timetable/filter, schoolyears (new REST, 2026-08 discovery) --------------------------
    TimetableMenuResponse:
      type: object
      required: [myTimetable, dependents, availableTimetables]
      properties:
        myTimetable:
          $ref: '#/components/schemas/TimetableMenuEntry'
        dependents:
          type: array
          items: { $ref: '#/components/schemas/TimetableMenuEntry' }
          description: "Empty for every account captured so far (none had dependents) — item shape presumed identical to `myTimetable`'s, unconfirmed."
        availableTimetables:
          type: array
          items: { $ref: '#/components/schemas/ResourceType' }
          description: "**Not** a list of specific resources — the `ResourceType`s this account is allowed to browse via `timetable/filter`. Confirmed narrower per account type (2026-08 probe, all four credentialed schools): TEACHER accounts get all four; a STUDENT account got `[CLASS, STUDENT]` only; a CLASS account got `[CLASS]` only."
    TimetableMenuEntry:
      type: object
      properties:
        type: { $ref: '#/components/schemas/ResourceType' }
        resource: { $ref: '#/components/schemas/TimetableResource' }
        imageUrl: { type: string, nullable: true, description: "`null` for every account observed so far — presumably a profile photo URL when set." }

    TimetableFilterResponse:
      type: object
      description: |
        One unified shape for every `resourceType` request — only the array(s) matching the requested type
        are populated, the rest come back empty. See `../captures/home/timetable_filter.md`.
      properties:
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        preSelected:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TimetableResource' }]
          description: "The resource that would be pre-highlighted for this resourceType — the caller's own resource where applicable (e.g. their own class for `CLASS`, own teacher entry for `TEACHER`), `null` where there's no obvious default (`STUDENT`, `ROOM`)."
        buildings: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures." }
        departments: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures; NOT the same as the per-class/-teacher `department` field below, which IS populated." }
        roomGroups: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures." }
        resourceTypes: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures; not to be confused with the `resourceType` field on this same object." }
        assignmentGroups: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures at this level (a same-named field also appears per-student, also always empty)." }
        resources: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures for every resourceType tried, including the ones that have their own dedicated array below (`classes`/`teachers`/`rooms`/`students`) — purpose unclear." }
        subjects: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures. Presumably populated for a `resourceType=SUBJECT` request, which is itself unconfirmed as valid (see `ResourceType`)." }
        classes:
          type: array
          description: Populated for `resourceType=CLASS` **and** `resourceType=STUDENT` (the full list of the school's classes either way).
          items:
            type: object
            properties:
              class: { $ref: '#/components/schemas/TimetableResource' }
              classTeacher1: { nullable: true, allOf: [{ $ref: '#/components/schemas/TimetableResource' }] }
              classTeacher2: { nullable: true, allOf: [{ $ref: '#/components/schemas/TimetableResource' }] }
              department: { nullable: true, allOf: [{ $ref: '#/components/schemas/TimetableResource' }], description: "`null` observed live for some classes on the full class list — not every class has a department assigned." }
        teachers:
          type: array
          description: Populated for `resourceType=TEACHER`.
          items:
            type: object
            properties:
              teacher: { $ref: '#/components/schemas/TimetableResource' }
              departments:
                type: array
                items: { $ref: '#/components/schemas/TimetableResource' }
              imageUrl: { type: string, nullable: true }
        rooms:
          type: array
          description: Populated for `resourceType=ROOM`.
          items:
            type: object
            properties:
              room: { $ref: '#/components/schemas/TimetableResource' }
              capacity: { type: integer, description: "`0` for every room observed — **UNKNOWN** whether that's a genuine unset-default or the field is simply never populated for this school." }
              roomGroups: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures." }
              building: { nullable: true, allOf: [{ $ref: '#/components/schemas/TimetableResource' }] }
              department: { nullable: true, allOf: [{ $ref: '#/components/schemas/TimetableResource' }] }
        students:
          type: array
          description: "Populated for `resourceType=STUDENT` — the school's **full** student directory, not scoped to the caller's own classes (several hundred entries for the one school probed). Contains real student PII (names)."
          items:
            type: object
            properties:
              student: { $ref: '#/components/schemas/TimetableResource' }
              classes:
                type: array
                description: The student's own class-membership history (more than one entry if they changed classes mid-year).
                items:
                  type: object
                  properties:
                    class: { $ref: '#/components/schemas/TimetableResource' }
                    dateRange:
                      type: object
                      properties:
                        start: { type: string, format: date }
                        end: { type: string, format: date }
                    department: { nullable: true, allOf: [{ $ref: '#/components/schemas/TimetableResource' }] }
              assignmentGroups: { type: array, items: {}, description: "**UNKNOWN** item shape — always empty in captures." }
              imageUrl: { type: string, nullable: true, description: "`null` for every student observed so far." }

    SchoolYear:
      type: object
      description: "See `../captures/home/schoolyears.md`. Field names match `getUserData2017`'s legacy `masterData.schoolyears` shape; `id` numbering cross-compatibility between the two is unconfirmed."
      properties:
        id: { type: integer }
        name: { type: string, description: 'e.g. `"2026/2027"`.' }
        dateRange:
          type: object
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
