openapi: 3.0.3
info:
  title: Untis Mobile API (reverse-engineered, 2026 generation)
  version: "2026.1.0-reverse-engineered"
  description: |
    Reverse-engineered specification of the private API used by the official "Untis Mobile" Android app
    (captured against app version `a6.7.0`, WebUntis server version `2027.0.2`, mobile API version `2.26.0`).
    This is **not** an official, published, or supported API. It was derived by intercepting HTTPS traffic
    with HTTP Toolkit (see `docs/api/index.md`) from four real school tenants, and is documented here purely
    to drive a from-scratch rewrite of EigenPlan's data layer.

    ## Two API generations in one server

    The backend exposes **two coexisting styles** of endpoint:

    1. **Legacy JSON-RPC 2.0**, POSTed to `/WebUntis/jsonrpc_intern.do?school=...&m=<method>&a=<bool>&s=<host>&v=a6.7.0`
       (plus one outlier, `schoolquery2`, on its own host). This is the *only* style the current EigenPlan
       codebase (`lib/core/rpc_request/`) speaks. Every JSON-RPC call except `searchSchool`, `getAppInfo` and
       `getAppSharedSecret` requires an `auth` object (see `AuthObject`) carrying a TOTP one-time password.
    2. **A newer REST-ish API**, under `/WebUntis/api/**`, authenticated with a `Bearer` JWT (or, for schools
       with anonymous login, an `anonymous-school-base64` header instead). This is where all of the
       *interesting* new data lives — the home/dashboard screen, the redesigned messages inbox, and a
       completely redesigned timetable (`timetable/grid` + `timetable/entries`) that has **no equivalent**
       in the old `getTimetable2017` JSON-RPC call. The old call still works and still returns data (see the
       `getTimetable2017` examples below) but the app itself now appears to prefer the REST timetable
       endpoints for rendering — the JSON-RPC timetable call may only remain for `masterData`/back-compat.

    A rewrite should almost certainly standardize on the REST endpoints wherever an equivalent exists, and
    only fall back to JSON-RPC for the pieces that have no REST equivalent yet (see `NOTES.md` next to this
    file for the endpoint-by-endpoint recommendation and a list of things marked **UNKNOWN** below that need
    a follow-up capture before they can be trusted).

    ## Multi-tenant / multi-login-flow support

    Four schools were captured, each exercising a different corner of the login flow:

    | School (`loginName`)       | Login flow                                                                 |
    |-----------------------------|-----------------------------------------------------------------------------|
    | `cjd-koewi`                 | Baseline: username + password, `ssoLoginEnabled: true`, `anonymousLoginEnabled: false` |
    | `bs-gfv`                    | **Anonymous login** — no credentials at all; see the "Anonymous login" section below |
    | `wolfsburger-oberschule`    | Normal username + password login, but the captured account is a **teacher** (`role: TEACHER`), useful for seeing rights/permissions that differ from a student/class account |
    | `schuldorf`                 | **SSO-only** login (`ssoLoginEnabled: true`, password login disabled server-side) — see the "SSO / key-based login" section below |

    ### Anonymous login (`bs-gfv`)

    `GET /WebUntis/api/public/v1/login-meta` reports `anonymousLoginEnabled: true` for this school. For an
    anonymous session:
    - The JSON-RPC `auth` object becomes `{ "user": "#anonymous#", "otp": 0, "clientTime": <now> }` — no
      app-shared-secret / OTP computation needed, `otp` is a literal `0`.
    - Some REST GET endpoints accept an `anonymous-school-base64` header **instead of** `Authorization: Bearer`,
      whose value is the school's `loginName`, base64-encoded (e.g. `bs-gfv` → `YnMtZ2Z2`). This was directly
      observed on `/api/rest/view/v2/home`, `/api/rest/view/v1/dashboard/cards`, and `/api/rest/view/v1/timetable/menu`.
      **UNKNOWN**: whether *every* REST GET endpoint accepts this header, or whether the app instead calls
      `getAuthToken` with the anonymous `auth` object above to obtain a real (if low-privilege) bearer JWT and
      uses that everywhere else — both patterns were seen in the raw captures for different endpoints and this
      needs a follow-up capture to resolve definitively. This spec applies `anonymousSchoolHeader` as an
      alternative security scheme only on the three endpoints where it was directly observed.
    - `getUserData2017`/`data` (mobile/data) come back with `user: null` (mobile/data) or a synthetic user
      (`elemId: -1`, `displayName: "IDC_ANONYMOUSUSER"`) for `getUserData2017` — model the "logged in user" as
      nullable/optional everywhere, this is not an edge case for this school, it's the steady state.

    ### SSO / key-based login (`schuldorf`)

    This school has SSO login enabled and (per capture notes) password-based login disabled server-side. The
    Untis Mobile app instead lets the user either scan a QR code or manually paste in a **key** — in both
    cases that key is used *as if it were the app-shared-secret* to compute the TOTP `otp` directly, entirely
    skipping `getAppSharedSecret`/`authentication`. This matches the fallback path already implemented in
    `activateSession()` (`lib/core/untis/untis_session.dart`) for "password is actually already a shared
    secret" (used today for QR-code logins) — for `schuldorf` this fallback is not an edge case, it is the
    *only* working path, since there is no real password to submit. A rewrite should treat "the stored secret
    IS the app-shared-secret, submitted password was never real" as a first-class login mode per school
    (driven by `login-meta`'s `ssoLoginEnabled`), not a try/catch fallback after a failed normal login.

    ## Redacted example data

    All example values in this document (JWTs, FCM push tokens, S3 signed URLs/SSE-C keys, app-shared-secrets,
    person names, message content) have been replaced with clearly-fake placeholders. The raw HTTP Toolkit
    captures this spec was derived from live under `docs/api/captures/home/` and `docs/api/captures/startup/`
    and have been redacted the same way before being committed — never re-introduce real secrets into either
    location.

  contact:
    name: EigenPlan (your_schedule) — internal reverse-engineering notes
externalDocs:
  description: Capture methodology and raw request/response dumps this spec was derived from
  url: ../index.md

servers:
  - url: "https://{schoolServer}.webuntis.com"
    description: Per-school WebUntis server. Host and the `school` query parameter both carry the school's `loginName`.
    variables:
      schoolServer:
        default: cjd-koewi
        description: "The school's `loginName` / server subdomain, e.g. `cjd-koewi`, `bs-gfv`, `wolfsburger-oberschule`, `schuldorf`."

tags:
  - name: discovery
    description: Finding a school and its login capabilities, before any authentication exists.
  - name: legacy-rpc
    description: The legacy JSON-RPC 2.0 dispatcher (`jsonrpc_intern.do`). One physical endpoint, many logical methods.
  - name: auth
    description: Obtaining and exchanging credentials for tokens.
  - name: session
    description: Bootstrapping app state right after login (tenant/user info, push registration, startup triggers).
  - name: home
    description: The home/dashboard screen.
  - name: messages
    description: The messages inbox.
  - name: timetable
    description: The (new, REST-based) timetable.
  - name: calendar
    description: Calendar entry detail (period drill-down), used from both the timetable and homework/exam views.

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------------------------------------
  # Discovery
  # ---------------------------------------------------------------------------------------------------------
  /schoolquery2:
    servers:
      - url: "https://schoolsearch.webuntis.com"
        description: Fixed host, independent of any school. Does not require the per-school server variable.
    post:
      tags: [discovery]
      summary: Search for a school by name, or resolve a tenant ID to a school
      description: |
        JSON-RPC 2.0 call, method `searchSchool`. This is the very first request the app makes; nothing is
        known about the school yet, so there's no `school` query parameter and no auth.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSchoolRequest'
            examples:
              bySearchTerm:
                summary: Free-text search (school picker autocomplete)
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: searchSchool
                  params: [{ search: "cjd" }]
              byTenantId:
                summary: Resolve a previously-known tenant ID (e.g. re-verifying a saved session's school)
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: searchSchool
                  params: [{ tenantid: "5237400" }]
      responses:
        '200':
          description: |
            Always HTTP 200, even for the "too many results" case — check for `error` vs `result` in the body,
            per standard JSON-RPC 2.0.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SearchSchoolResult'
                  - $ref: '#/components/schemas/RpcErrorEnvelope'
              examples:
                found:
                  value:
                    id: "untis-mobile-android-6.7.0"
                    jsonrpc: "2.0"
                    result:
                      size: 0
                      schools:
                        - server: cjd-koewi.webuntis.com
                          useMobileServiceUrlAndroid: false
                          address: "53639, Königswinter, Cleethorpeser Platz 12"
                          displayName: "CJD Königswinter Christophorusschule"
                          loginName: cjd-koewi
                          schoolId: 5237400
                          useMobileServiceUrlIos: false
                          serverUrl: "https://cjd-koewi.webuntis.com/WebUntis/?school=cjd-koewi"
                          tenantId: "5237400"
                          mobileServiceUrl: null
                notFound:
                  value:
                    id: "untis-mobile-android-6.7.0"
                    jsonrpc: "2.0"
                    result: { size: 0, schools: [] }
                tooManyResults:
                  summary: "Search term too broad (observed for a 3-letter generic term)"
                  value:
                    id: "untis-mobile-android-6.7.0"
                    jsonrpc: "2.0"
                    error: { code: -6003, message: "too many results" }

  /WebUntis/api/public/v1/login-meta:
    get:
      tags: [discovery]
      summary: Get a school's supported login methods
      description: |
        Called right after the school is selected, before any credentials are entered, to decide which login
        UI to show (password field, SSO button, or skip straight to "continue as guest").
      security: []
      parameters:
        - $ref: '#/components/parameters/school'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginMeta'
              examples:
                cjd:
                  summary: cjd-koewi — normal password login + SSO offered, no anonymous
                  value: { anonymousLoginEnabled: false, ssoLoginEnabled: true }
                bsGfv:
                  summary: bs-gfv — anonymous login enabled, no SSO
                  value: { anonymousLoginEnabled: true, ssoLoginEnabled: false }

  # ---------------------------------------------------------------------------------------------------------
  # Legacy JSON-RPC dispatcher
  # ---------------------------------------------------------------------------------------------------------
  /WebUntis/jsonrpc_intern.do:
    post:
      tags: [legacy-rpc]
      operationId: legacyJsonRpcDispatch
      summary: Legacy JSON-RPC 2.0 dispatcher (all `getXyz2017`-style methods)
      description: |
        One physical HTTP endpoint that dispatches on the request body's `method` field (the `m` query
        parameter appears to mirror the body's `method` — **UNKNOWN** whether the server actually reads the
        query param or only logs/routes with it; the app always sends both in lockstep, so this was never
        observed to diverge). Documented here as a single operation with a `oneOf`/`discriminator` request and
        response body per method, since OpenAPI has no native concept of "one path, many logical RPC methods"
        (OpenRPC would model this more naturally, but a plain OpenAPI doc is what renders in Swagger UI).

        Methods documented below (see `discriminator.mapping` on the request/response schemas for the full
        list): `getAppInfo`, `getAppSharedSecret`, `getAuthToken`, `getUserData2017`, `getTimetable2017`,
        `getMessagesOfDay2017`, `getStudentAbsences2017`, `getExams2017`, `getPeriodData2017`, `getHomeWork2017`.

        Every method except `getAppInfo` and `getAppSharedSecret` requires an `auth` object inside its single
        params object — see `AuthObject`.
      parameters:
        - $ref: '#/components/parameters/school'
        - name: m
          in: query
          required: true
          description: Method name, mirrors the request body's `method`.
          schema:
            type: string
            enum:
              - getAppInfo
              - getAppSharedSecret
              - getAuthToken
              - getUserData2017
              - getTimetable2017
              - getMessagesOfDay2017
              - getStudentAbsences2017
              - getExams2017
              - getPeriodData2017
              - getHomeWork2017
        - name: a
          in: query
          required: true
          description: "\"Anonymous\" flag. Observed `true` for bs-gfv's `getUserData2017` call, `false` otherwise."
          schema:
            type: boolean
        - name: s
          in: query
          required: true
          description: The school's server hostname (redundant with the `Host` header / `servers` base URL).
          schema:
            type: string
            example: cjd-koewi.webuntis.com
        - name: v
          in: query
          required: true
          description: Untis Mobile app version, prefixed with `a` (Android). Sent by the app as a fixed constant per release.
          schema:
            type: string
            example: a6.7.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RpcRequestGetAppInfo'
                - $ref: '#/components/schemas/RpcRequestGetAppSharedSecret'
                - $ref: '#/components/schemas/RpcRequestGetAuthToken'
                - $ref: '#/components/schemas/RpcRequestGetUserData2017'
                - $ref: '#/components/schemas/RpcRequestGetTimetable2017'
                - $ref: '#/components/schemas/RpcRequestGetMessagesOfDay2017'
                - $ref: '#/components/schemas/RpcRequestGetStudentAbsences2017'
                - $ref: '#/components/schemas/RpcRequestGetExams2017'
                - $ref: '#/components/schemas/RpcRequestGetPeriodData2017'
                - $ref: '#/components/schemas/RpcRequestGetHomeWork2017'
              discriminator:
                propertyName: method
                mapping:
                  getAppInfo: '#/components/schemas/RpcRequestGetAppInfo'
                  getAppSharedSecret: '#/components/schemas/RpcRequestGetAppSharedSecret'
                  getAuthToken: '#/components/schemas/RpcRequestGetAuthToken'
                  getUserData2017: '#/components/schemas/RpcRequestGetUserData2017'
                  getTimetable2017: '#/components/schemas/RpcRequestGetTimetable2017'
                  getMessagesOfDay2017: '#/components/schemas/RpcRequestGetMessagesOfDay2017'
                  getStudentAbsences2017: '#/components/schemas/RpcRequestGetStudentAbsences2017'
                  getExams2017: '#/components/schemas/RpcRequestGetExams2017'
                  getPeriodData2017: '#/components/schemas/RpcRequestGetPeriodData2017'
                  getHomeWork2017: '#/components/schemas/RpcRequestGetHomeWork2017'
            examples:
              getAppInfo:
                value: { id: "untis-mobile-android-6.7.0", jsonrpc: "2.0", method: getAppInfo, params: [] }
              getAppSharedSecret:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getAppSharedSecret
                  params: [{ password: "hunter2", userName: "Q1" }]
              getAuthToken:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getAuthToken
                  params: [{ auth: { clientTime: 1786788458268, otp: 730465, user: "Q1" } }]
              getUserData2017:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getUserData2017
                  params: [{ elementId: 0, auth: { clientTime: 1786788454232, otp: 730465, user: "Q1" } }]
              getUserData2017Anonymous:
                summary: "bs-gfv anonymous variant — otp is a literal 0, user is the literal string \"#anonymous#\""
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getUserData2017
                  params: [{ elementId: 0, auth: { clientTime: 1786794734914, otp: 0, user: "#anonymous#" } }]
              getTimetable2017:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getTimetable2017
                  params:
                    - endDate: "2026-08-15"
                      id: 1664
                      masterDataTimestamp: 1786788455112
                      startDate: "2026-08-15"
                      timetableTimestamp: 0
                      timetableTimestamps: [0]
                      type: CLASS
                      auth: { clientTime: 1786788458176, otp: 730465, user: "Q1" }
              getMessagesOfDay2017:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getMessagesOfDay2017
                  params: [{ date: "2026-08-15", auth: { clientTime: 1786788459646, otp: 730465, user: "Q1" } }]
              getStudentAbsences2017:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getStudentAbsences2017
                  params:
                    - includeUnExcused: true
                      startDate: "2026-08-08T12:00Z"
                      endDate: "2026-09-15T12:00Z"
                      includeExcused: true
                      auth: { clientTime: 1786796614129, otp: 87948, user: "musterschueler" }
              getExams2017:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getExams2017
                  params:
                    - endDate: "2026-08-22"
                      id: 1664
                      startDate: "2026-08-15"
                      type: CLASS
                      auth: { clientTime: 1786790506363, otp: 63818, user: "Q1" }
              getPeriodData2017:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getPeriodData2017
                  params:
                    - ttIds: [6503426, 6503423]
                      auth: { clientTime: 1786796831617, otp: 894103, user: "musterschueler" }
              getHomeWork2017:
                value:
                  id: "untis-mobile-android-6.7.0"
                  jsonrpc: "2.0"
                  method: getHomeWork2017
                  params:
                    - endDate: "2026-08-22"
                      id: 1664
                      startDate: "2026-08-15"
                      type: CLASS
                      auth: { clientTime: 1786790507388, otp: 63818, user: "Q1" }
      responses:
        '200':
          description: |
            Always HTTP 200 per JSON-RPC 2.0 convention; a request-level failure is signalled by an `error`
            key instead of `result` in the body (see `RpcErrorEnvelope`), not by the HTTP status code.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RpcResponseGetAppInfo'
                  - $ref: '#/components/schemas/RpcResponseGetAppSharedSecret'
                  - $ref: '#/components/schemas/RpcResponseGetAuthToken'
                  - $ref: '#/components/schemas/RpcResponseGetUserData2017'
                  - $ref: '#/components/schemas/RpcResponseGetTimetable2017'
                  - $ref: '#/components/schemas/RpcResponseGetMessagesOfDay2017'
                  - $ref: '#/components/schemas/RpcResponseGetStudentAbsences2017'
                  - $ref: '#/components/schemas/RpcResponseGetExams2017'
                  - $ref: '#/components/schemas/RpcResponseGetPeriodData2017'
                  - $ref: '#/components/schemas/RpcResponseGetHomeWork2017'
                  - $ref: '#/components/schemas/RpcErrorEnvelope'

  # ---------------------------------------------------------------------------------------------------------
  # REST auth
  # ---------------------------------------------------------------------------------------------------------
  "/WebUntis/api/mobile/v2/{school}/authentication":
    post:
      tags: [auth]
      summary: REST username/password login
      description: |
        Directly exchanges a username+password for a JWT, without going through `getAppSharedSecret`/`getAuthToken`.
        **UNKNOWN**: whether the resulting JWT is fully interchangeable with the one returned by the JSON-RPC
        `getAuthToken` method (same claims were observed — `tenant_id`, `sub`, `user_id`, `person_id`, etc. —
        but `getAuthToken`'s JWT additionally carries a non-empty `host` claim; the raw captures don't prove
        both are accepted by every REST endpoint). The original capture notes explicitly flag this as an open
        question worth re-verifying: *"Warum gibt getAuthToken und authentication? Funzen beide für beides?"*
        Not used for SSO-only schools (`schuldorf`) or anonymous schools (`bs-gfv`), where credentials aren't
        a real username/password pair.
      security: []
      parameters:
        - name: school
          in: path
          required: true
          schema: { type: string }
          example: cjd-koewi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'

  # ---------------------------------------------------------------------------------------------------------
  # Session bootstrap
  # ---------------------------------------------------------------------------------------------------------
  /WebUntis/api/rest/view/v3/mobile/data:
    get:
      tags: [session]
      summary: Tenant + logged-in-user summary
      description: |
        Called right after obtaining a bearer token. Distinct from (and much smaller than) the JSON-RPC
        `getUserData2017` payload — this is tenant/session metadata (school year, tenant display info, who's
        logged in and their role/permissions), not master data (klassen/rooms/subjects/teachers) or the
        timetable-relevant `settings` block. A rewrite should probably keep this as its own provider rather
        than merging it into the `getUserData2017`-derived `UserData` model.
      parameters:
        - $ref: '#/components/parameters/school'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDataResponse'
              examples:
                studentAccount:
                  value:
                    schoolYear: null
                    tenant: { id: "5237400", displayName: "Musterschule", wuVersion: "2027.0.2", language: "", schoolLoginName: cjd-koewi }
                    user:
                      id: 134
                      username: "musteruser"
                      person: { id: 1664, displayName: "musteruser", imageUrl: null }
                      referencedStudents: []
                      locale: de
                      departmentId: 1
                      role: KLASSE
                      permissions: [READ_MESSAGES]
                anonymousAccount:
                  summary: bs-gfv — no logged-in user at all
                  value:
                    schoolYear: null
                    tenant: { id: "3816800", displayName: "Musterschule BS", wuVersion: "2027.0.2", language: "", schoolLoginName: bs-gfv }
                    user: null
                teacherAccount:
                  summary: wolfsburger-oberschule — role TEACHER
                  value:
                    schoolYear: { dateRange: { start: "2026-08-13T00:00:00", end: "2027-07-07T00:00:00" }, id: 20, name: "2026/2027" }
                    tenant: { id: "6763800", displayName: "Musterschule WOBS", wuVersion: "2027.0.2", language: "", schoolLoginName: wolfsburger-oberschule }
                    user:
                      id: 1163
                      username: "musterlehrer"
                      person: { id: 134, displayName: "Musterlehrer", imageUrl: null }
                      referencedStudents: []
                      locale: de
                      departmentId: 1
                      role: TEACHER
                      permissions: [READ_MESSAGES, CLASS_REGISTER, CHANGE_OWN_PASSWORD]

  /WebUntis/api/rest/view/v1/profile/user-email:
    get:
      tags: [session]
      summary: Get the logged-in user's stored email address
      parameters:
        - $ref: '#/components/parameters/school'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email:
                    type: string
                    description: Empty string observed when no email is on file (not null).
                example: { email: "" }

  /WebUntis/api/rest/view/v1/trigger/startup:
    get:
      tags: [session]
      summary: Fetch pending "startup actions" (e.g. forced onboarding/consent dialogs)
      security:
        - bearerAuth: []
        - anonymousSchoolHeader: []
      parameters:
        - $ref: '#/components/parameters/school'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [startupActions]
                properties:
                  startupActions:
                    type: array
                    description: "**UNKNOWN** item shape — always observed empty across all 4 schools."
                    items: {}
              example: { startupActions: [] }

  /WebUntis/api/rest/view/v1/statistics/usage-statistics-status:
    post:
      tags: [session]
      summary: Check whether anonymous usage-statistics collection is active for this install
      description: "Sent with an empty body (`Content-Length: 0`)."
      parameters:
        - $ref: '#/components/parameters/school'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: { type: boolean }
              example: { active: false }

  # ---------------------------------------------------------------------------------------------------------
  # Push notifications
  # ---------------------------------------------------------------------------------------------------------
  /api/register/:
    post:
      tags: [session]
      summary: Register (or update) this device for push notifications
      description: |
        On a completely different host (`push.webuntis.com`), not the school's server. Sent once at startup
        after login. Note this project (per `CLAUDE.md`) has push/background notifications intentionally
        disabled/unimplemented for now — documented here for completeness only.
      servers:
        - url: "https://push.webuntis.com"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRegistration'
      responses:
        '200':
          description: OK — echoes back the registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushRegistration'

  "/api/refresh-device-presence/{deviceId}":
    patch:
      tags: [session]
      summary: "**UNKNOWN** — refresh this device's push \"presence\""
      description: |
        Only observed mentioned in passing in the `schuldorf` capture notes ("what is this?") with no captured
        request/response body. Presumably a keep-alive heartbeat so the push backend knows the device/token is
        still live. Not safe to implement against until captured properly.
      servers:
        - url: "https://push.webuntis.com"
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: "**UNKNOWN** response shape."

